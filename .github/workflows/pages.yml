# Publishes the landing page (landing/) at the root of GitHub Pages and the static UI (web/) under /app/.
# The UI holds no data or secrets; it connects to a hermes-ui backend over iroh after pairing (see README).
# scripts/build-pages.mjs assembles the site; it keeps the UI's service worker at the root (see there).
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'landing/**', 'site/**', 'scripts/build-pages.mjs', '.github/workflows/pages.yml']
  # Pull requests build the site (the check), only pushes to main deploy it.
  pull_request:
    paths: ['web/**', 'landing/**', 'site/**', 'scripts/build-pages.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node scripts/build-pages.mjs
      - name: Check the site layout
        run: |
          test -f _site/index.html && test -f _site/app/index.html && test -f _site/app/manifest.webmanifest
          test -f _site/iroh-sw.js && grep -q "HERMES_UI_APP_PATH = 'app/'" _site/sw.js
          test ! -e _site/app/sw.js
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
