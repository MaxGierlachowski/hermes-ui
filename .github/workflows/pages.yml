# Builds the static UI (web/) and publishes it to GitHub Pages. The UI holds no data or secrets;
# it connects to a hermes-ui backend over iroh after pairing (see README).
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'site/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Static pages next to the UI: privacy policy and support (site/), linked from the store listings.
      - run: cp -R site/. web/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
