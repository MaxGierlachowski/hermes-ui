# Lint, typecheck and tests for backend, web UI and mobile app. Needs no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run build   # includes tsc -b (typecheck)

  # The desktop pixel baselines are rendered on macOS (fonts differ elsewhere).
  ui-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: web
      - run: npm run test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  mobile-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
        working-directory: mobile-app
      - run: npm run typecheck
        working-directory: mobile-app
      - name: Expo config resolves (identity from the environment, no secrets)
        run: npx expo config --type public --json > /dev/null
        working-directory: mobile-app

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/modules/expo-iroh/rust
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile-app/modules/expo-iroh/rust
      - run: rustup show active-toolchain   # installs the pinned toolchain from rust-toolchain.toml
      - run: cargo check --release --lib --locked
