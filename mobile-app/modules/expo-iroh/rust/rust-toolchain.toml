# The Rust toolchain the iroh library is built and tested with. rustup installs it (and the targets)
# on the first cargo call in this directory.
[toolchain]
channel = "1.100.0"
profile = "minimal"
targets = ["aarch64-linux-android", "x86_64-linux-android", "aarch64-apple-ios", "aarch64-apple-ios-sim"]
